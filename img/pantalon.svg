<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: pantalón de vestir de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Pantalón de vestir</title>
  <defs>
    <!-- Tejido de gabardina: líneas diagonales muy finas -->
    <pattern id="gabardina" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 1 H5" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M0 3.5 H5" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2"/>
    </pattern>
    <clipPath id="prenda">
      <path d="M190 60 L410 60 L418 560 L312 560 L300 270 L288 560 L182 560 Z"/>
    </clipPath>
  </defs>

  <!-- Pantalón negro de corte recto -->
  <g clip-path="url(#prenda)">
    <rect x="170" y="50" width="260" height="520" fill="#363636"/>
    <!-- Pliegues: tonos planos -->
    <path d="M190 100 L240 250 L237 560 L182 560 Z" fill="#1E1E1E" fill-opacity="0.6"/>
    <path d="M410 100 L360 250 L363 560 L418 560 Z" fill="#1E1E1E" fill-opacity="0.6"/>
    <path d="M232 260 L246 260 L244 560 L230 560 Z" fill="#FFFFFF" fill-opacity="0.09"/>
    <path d="M354 260 L368 260 L370 560 L356 560 Z" fill="#FFFFFF" fill-opacity="0.09"/>
    <path d="M288 270 L300 270 L312 560 L288 560 Z" fill="#000000" fill-opacity="0.35"/>
    <path d="M205 150 Q215 190 222 230" stroke="#000000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <path d="M395 150 Q385 190 378 230" stroke="#000000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <rect x="170" y="50" width="260" height="520" fill="url(#gabardina)"/>
  </g>
  <path d="M190 60 L410 60 L418 560 L312 560 L300 270 L288 560 L182 560 Z"
        fill="none" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cinturilla y pasadores -->
  <path d="M190 60 L410 60 L410 94 L190 94 Z" fill="#363636" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="190" y="60" width="220" height="34" fill="url(#gabardina)"/>
  <path d="M192 90 L408 90" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <g fill="#363636" stroke="#0D0D0D" stroke-width="1.5">
    <rect x="215" y="58" width="10" height="38"/>
    <rect x="265" y="58" width="10" height="38"/>
    <rect x="325" y="58" width="10" height="38"/>
    <rect x="375" y="58" width="10" height="38"/>
  </g>
  <g stroke="#8A8A8A" stroke-width="0.9" stroke-dasharray="3 2.5" fill="none">
    <path d="M217 62 V92"/><path d="M223 62 V92"/>
    <path d="M267 62 V92"/><path d="M273 62 V92"/>
    <path d="M327 62 V92"/><path d="M333 62 V92"/>
    <path d="M377 62 V92"/><path d="M383 62 V92"/>
  </g>

  <!-- Cinturón de cuero con hebilla de metal -->
  <rect x="190" y="68" width="220" height="18" fill="#1B1B1B" stroke="#000000" stroke-width="2"/>
  <path d="M192 72 L408 72 M192 82 L408 82" stroke="#5A5A5A" stroke-width="0.9" stroke-dasharray="5 3" fill="none"/>
  <rect x="284" y="63" width="32" height="28" rx="3" fill="none" stroke="#B5B5B5" stroke-width="3"/>
  <path d="M300 77 L318 77" stroke="#B5B5B5" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="330" cy="77" r="1.5" fill="#000000"/>

  <!-- Costuras: bragueta, bolsillos, pliegues, dobladillos -->
  <g fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 96 L300 190 Q300 205 290 210"/>
    <path d="M195 100 Q234 112 242 175"/>
    <path d="M405 100 Q366 112 358 175"/>
  </g>
  <g fill="none" stroke="#8A8A8A" stroke-width="1.1" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 100 L296 188 Q296 201 287 206"/>
    <path d="M199 108 Q230 118 237 175"/>
    <path d="M401 108 Q370 118 363 175"/>
    <path d="M185 538 L291 538"/>
    <path d="M309 538 L415 538"/>
  </g>
  <!-- Dobladillo -->
  <g fill="none" stroke="#0D0D0D" stroke-width="1.5">
    <path d="M184 546 L290 546"/>
    <path d="M310 546 L416 546"/>
  </g>
  <!-- Botón de la cintura -->
  <circle cx="318" cy="112" r="5" fill="#1B1B1B" stroke="#8A8A8A" stroke-width="1.2"/>
</svg>
