<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: pantalón de vestir de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Pantalón de vestir</title>

  <!-- Pantalón negro de corte recto -->
  <path d="M190 60 L410 60 L418 560 L312 560 L300 270 L288 560 L182 560 Z"
        fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cinturilla y pasadores -->
  <path d="M190 60 L410 60 L410 94 L190 94 Z" fill="#2B2B2B" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#2B2B2B" stroke="#0D0D0D" stroke-width="1.5">
    <rect x="215" y="58" width="10" height="38"/>
    <rect x="265" y="58" width="10" height="38"/>
    <rect x="325" y="58" width="10" height="38"/>
    <rect x="375" y="58" width="10" height="38"/>
  </g>

  <!-- Cinturón con hebilla -->
  <rect x="190" y="68" width="220" height="18" fill="#161616" stroke="#000000" stroke-width="2"/>
  <rect x="284" y="63" width="32" height="28" rx="3" fill="none" stroke="#9A9A9A" stroke-width="2.5"/>
  <path d="M300 77 L318 77" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round"/>

  <!-- Costuras finas: bragueta, bolsillos, pliegues, dobladillos -->
  <g fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 96 L300 190 Q300 205 290 210"/>
    <path d="M195 100 Q234 112 242 175"/>
    <path d="M405 100 Q366 112 358 175"/>
    <path d="M240 250 L237 555"/>
    <path d="M360 250 L363 555"/>
    <path d="M185 544 L291 544" stroke-dasharray="6 4"/>
    <path d="M309 544 L415 544" stroke-dasharray="6 4"/>
  </g>
</svg>
