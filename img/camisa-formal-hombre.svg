<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: camisa formal de hombre de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Camisa formal de hombre</title>
  <defs>
    <!-- Tejido de popelina: hilos finos cruzados -->
    <pattern id="tejido" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1 H4" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1"/>
      <path d="M1 0 V4" stroke="#0A1830" stroke-opacity="0.20" stroke-width="1"/>
      <path d="M0 3 H4" stroke="#0A1830" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="cuerpo">
      <path d="M250 85 L150 110 L80 420 L142 445 L174 255 L170 510 L430 510 L426 255 L458 445 L520 420 L450 110 L350 85 Q300 125 250 85 Z"/>
    </clipPath>
    <clipPath id="cuelloIzq"><path d="M250 82 L222 108 L262 150 L300 122 Q275 112 250 82 Z"/></clipPath>
    <clipPath id="cuelloDer"><path d="M350 82 L378 108 L338 150 L300 122 Q325 112 350 82 Z"/></clipPath>
  </defs>

  <!-- Cuerpo y mangas largas -->
  <g clip-path="url(#cuerpo)">
    <rect x="60" y="70" width="480" height="460" fill="#2A4D82"/>
    <!-- Tonos planos que marcan los pliegues de la tela -->
    <path d="M150 110 Q190 190 174 255 L170 510 L205 510 L205 270 Q215 190 190 118 Z" fill="#1B3A66" fill-opacity="0.55"/>
    <path d="M450 110 Q410 190 426 255 L430 510 L395 510 L395 270 Q385 190 410 118 Z" fill="#1B3A66" fill-opacity="0.55"/>
    <path d="M80 420 L142 445 L160 330 L112 320 Z" fill="#1B3A66" fill-opacity="0.45"/>
    <path d="M520 420 L458 445 L440 330 L488 320 Z" fill="#1B3A66" fill-opacity="0.45"/>
    <path d="M225 300 Q240 400 232 510 L250 510 Q258 400 244 300 Z" fill="#FFFFFF" fill-opacity="0.07"/>
    <path d="M375 300 Q360 400 368 510 L350 510 Q342 400 356 300 Z" fill="#FFFFFF" fill-opacity="0.07"/>
    <path d="M110 150 L140 240" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round" fill="none"/>
    <rect x="60" y="70" width="480" height="460" fill="url(#tejido)"/>
  </g>
  <path d="M250 85 L150 110 L80 420 L142 445 L174 255 L170 510 L430 510 L426 255 L458 445 L520 420 L450 110 L350 85 Q300 125 250 85 Z"
        fill="none" stroke="#10233F" stroke-width="3" stroke-linejoin="round"/>

  <!-- Puños con costura -->
  <g fill="none" stroke="#10233F" stroke-linecap="round">
    <path d="M90 386 L150 412" stroke-width="2"/>
    <path d="M510 386 L450 412" stroke-width="2"/>
    <path d="M93 378 L146 402" stroke="#9FB6D6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M507 378 L454 402" stroke="#9FB6D6" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <!-- Cuello clásico con pespunte -->
  <g stroke="#10233F" stroke-width="3" stroke-linejoin="round">
    <path d="M250 82 L222 108 L262 150 L300 122 Q275 112 250 82 Z" fill="#2A4D82"/>
    <path d="M350 82 L378 108 L338 150 L300 122 Q325 112 350 82 Z" fill="#2A4D82"/>
  </g>
  <g clip-path="url(#cuelloIzq)"><rect x="215" y="75" width="90" height="80" fill="url(#tejido)"/></g>
  <g clip-path="url(#cuelloDer)"><rect x="295" y="75" width="90" height="80" fill="url(#tejido)"/></g>
  <g fill="none" stroke="#9FB6D6" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round">
    <path d="M250 92 L231 110 L262 142"/>
    <path d="M350 92 L369 110 L338 142"/>
  </g>

  <!-- Tapeta con doble pespunte -->
  <rect x="288" y="122" width="24" height="388" fill="#2A4D82" stroke="#10233F" stroke-width="2"/>
  <g clip-path="url(#cuerpo)"><rect x="288" y="122" width="24" height="388" fill="url(#tejido)"/></g>
  <g stroke="#9FB6D6" stroke-width="1.2" stroke-dasharray="5 3" fill="none">
    <path d="M292 150 V506"/>
    <path d="M308 150 V506"/>
  </g>

  <!-- Botones con 4 ojales e hilo -->
  <g>
    <g id="boton">
      <circle cx="300" cy="160" r="6.5" fill="#E8EDF4" stroke="#10233F" stroke-width="1.5"/>
      <circle cx="300" cy="160" r="4" fill="none" stroke="#B9C5D6" stroke-width="1"/>
      <circle cx="298" cy="158" r="0.9" fill="#10233F"/><circle cx="302" cy="158" r="0.9" fill="#10233F"/>
      <circle cx="298" cy="162" r="0.9" fill="#10233F"/><circle cx="302" cy="162" r="0.9" fill="#10233F"/>
      <path d="M298 158 L302 162 M302 158 L298 162" stroke="#6F86A8" stroke-width="0.8"/>
    </g>
    <use href="#boton" y="55"/><use href="#boton" y="110"/><use href="#boton" y="165"/>
    <use href="#boton" y="220"/><use href="#boton" y="275"/><use href="#boton" y="325"/>
  </g>

  <!-- Costuras de sisas y dobladillo -->
  <g fill="none" stroke="#10233F" stroke-width="1.5" stroke-linecap="round">
    <path d="M150 110 Q190 190 174 255"/>
    <path d="M450 110 Q410 190 426 255"/>
  </g>
  <g fill="none" stroke="#9FB6D6" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round">
    <path d="M156 122 Q194 192 180 255"/>
    <path d="M444 122 Q406 192 420 255"/>
    <path d="M172 498 L428 498"/>
  </g>
  <!-- Botones de los puños -->
  <g fill="#E8EDF4" stroke="#10233F" stroke-width="1.3">
    <circle cx="115" cy="419" r="4.5"/>
    <circle cx="485" cy="419" r="4.5"/>
  </g>

  <!-- Bolsillo del pecho con pespunte -->
  <g stroke-linejoin="round">
    <path d="M195 190 L255 190 L255 238 L225 254 L195 238 Z" fill="#2F5489" stroke="#10233F" stroke-width="1.8"/>
    <path d="M195 202 L255 202" stroke="#10233F" stroke-width="1.5" fill="none"/>
    <path d="M200 195 L250 195 M200 208 L250 208 L250 235 L225 248 L200 235 Z" stroke="#9FB6D6" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  </g>

  <!-- Recuadro del bordado del cliente, vacío -->
  <rect x="340" y="190" width="58" height="42" rx="3" fill="none"
        stroke="#B7C7DE" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
