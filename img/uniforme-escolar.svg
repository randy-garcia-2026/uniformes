<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: uniforme escolar (suéter, camisa y falda) de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Uniforme escolar, suéter, camisa y falda de cuadros</title>
  <defs>
    <clipPath id="falda">
      <path d="M205 330 L395 330 L440 570 L160 570 Z"/>
    </clipPath>
    <clipPath id="sueter">
      <path d="M250 92 L222 100 Q216 205 166 252 L166 505 L434 505 L434 252 Q384 205 378 100 L350 92 L300 215 Z"/>
    </clipPath>
    <clipPath id="camisa">
      <path d="M250 85 L150 115 L70 215 L140 255 L160 225 L160 510 L440 510 L440 225 L460 255 L530 215 L450 115 L350 85 Q300 125 250 85 Z"/>
    </clipPath>
    <!-- Punto de lana del suéter: columnas de "V" tejidas -->
    <pattern id="punto" width="8" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0 L4 8 L8 0" fill="none" stroke="#0F2E1D" stroke-opacity="0.55" stroke-width="1.6"/>
      <path d="M0 2 L4 10 L8 2" fill="none" stroke="#7FB394" stroke-opacity="0.18" stroke-width="1.2"/>
    </pattern>
    <!-- Popelina de la camisa -->
    <pattern id="popelina" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 1 H5" stroke="#B5B5B5" stroke-opacity="0.35" stroke-width="1"/>
      <path d="M1 0 V5" stroke="#B5B5B5" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <!-- Hilo fino sobre la lana de cuadros -->
    <pattern id="sarga" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 1 H5" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M0 3.5 H5" stroke="#000000" stroke-opacity="0.22" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Camisa blanca de manga corta y suéter sin mangas (dibujados en 600 x 600 y reducidos) -->
  <g transform="translate(155,10) scale(0.54)">
    <!-- Camisa -->
    <g clip-path="url(#camisa)">
      <rect x="60" y="80" width="480" height="440" fill="#F6F6F3"/>
      <path d="M70 215 L140 255 L160 225 L150 115 Z" fill="#CFCFC8" fill-opacity="0.55"/>
      <path d="M530 215 L460 255 L440 225 L450 115 Z" fill="#CFCFC8" fill-opacity="0.55"/>
      <rect x="60" y="80" width="480" height="440" fill="url(#popelina)"/>
    </g>
    <path d="M250 85 L150 115 L70 215 L140 255 L160 225 L160 510 L440 510 L440 225 L460 255 L530 215 L450 115 L350 85 Q300 125 250 85 Z"
          fill="none" stroke="#8C8C8C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M77 203 L150 241" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 192 L146 228" fill="none" stroke="#A9A9A9" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>
    <path d="M523 203 L450 241" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round"/>
    <path d="M516 192 L454 228" fill="none" stroke="#A9A9A9" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>

    <!-- Suéter verde oscuro sin mangas, cuello en V, de punto -->
    <g clip-path="url(#sueter)">
      <rect x="150" y="85" width="300" height="430" fill="#24593B"/>
      <!-- Tonos planos que marcan el volumen del tejido -->
      <path d="M166 252 L166 505 L215 505 L215 240 Z" fill="#12361F" fill-opacity="0.5"/>
      <path d="M434 252 L434 505 L385 505 L385 240 Z" fill="#12361F" fill-opacity="0.5"/>
      <path d="M270 300 L290 300 L288 505 L268 505 Z" fill="#FFFFFF" fill-opacity="0.06"/>
      <rect x="150" y="85" width="300" height="430" fill="url(#punto)"/>
      <!-- Cinturilla de acanalado (rayas verticales) -->
      <rect x="166" y="470" width="268" height="35" fill="#1B4A2F"/>
      <path d="M166 478 H434 M166 486 H434" stroke="none"/>
      <g stroke="#0F2E1D" stroke-width="2" stroke-opacity="0.7">
        <path d="M178 470 V505 M190 470 V505 M202 470 V505 M214 470 V505 M226 470 V505 M238 470 V505 M250 470 V505 M262 470 V505 M274 470 V505 M286 470 V505 M298 470 V505 M310 470 V505 M322 470 V505 M334 470 V505 M346 470 V505 M358 470 V505 M370 470 V505 M382 470 V505 M394 470 V505 M406 470 V505 M418 470 V505"/>
      </g>
    </g>
    <path d="M250 92 L222 100 Q216 205 166 252 L166 505 L434 505 L434 252 Q384 205 378 100 L350 92 L300 215 Z"
          fill="none" stroke="#10301E" stroke-width="5" stroke-linejoin="round"/>
    <g fill="none" stroke="#10301E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 98 L300 186 L338 98"/>
      <path d="M166 470 L434 470"/>
      <path d="M232 110 Q230 200 176 250"/>
      <path d="M368 110 Q370 200 424 250"/>
    </g>
    <!-- Cuello en V con acanalado -->
    <g fill="none" stroke="#10301E" stroke-width="1.8" stroke-opacity="0.8">
      <path d="M270 100 L300 172 L330 100"/>
      <path d="M277 100 L300 160 L323 100"/>
    </g>

    <!-- Cuello de la camisa asomando en la V -->
    <path d="M252 84 L226 104 L272 158 L298 190 L298 146 Z"
          fill="#F6F6F3" stroke="#8C8C8C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M348 84 L374 104 L328 158 L302 190 L302 146 Z"
          fill="#F6F6F3" stroke="#8C8C8C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M252 96 L236 108 L274 152 M348 96 L364 108 L326 152" fill="none" stroke="#B5B5B5" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>

    <!-- Recuadro del bordado del cliente (pecho), vacío -->
    <rect x="320" y="270" width="60" height="46" rx="4" fill="none"
          stroke="#9CC0A8" stroke-width="3" stroke-dasharray="7 5"/>
  </g>

  <!-- Falda de cuadros de lana -->
  <g clip-path="url(#falda)">
    <rect x="150" y="320" width="300" height="260" fill="#2E5A3E"/>
    <g stroke="#6E9C79" stroke-width="5" fill="none">
      <path d="M221 330 L185 570"/>
      <path d="M253 330 L233 570"/>
      <path d="M285 330 L278 570"/>
      <path d="M317 330 L325 570"/>
      <path d="M349 330 L372 570"/>
      <path d="M381 330 L419 570"/>
      <path d="M150 358 L450 358"/>
      <path d="M150 408 L450 408"/>
      <path d="M150 458 L450 458"/>
      <path d="M150 508 L450 508"/>
      <path d="M150 558 L450 558"/>
    </g>
    <g stroke="#1B3A27" stroke-width="2" fill="none">
      <path d="M237 330 L209 570"/>
      <path d="M301 330 L301 570"/>
      <path d="M365 330 L396 570"/>
      <path d="M150 383 L450 383"/>
      <path d="M150 433 L450 433"/>
      <path d="M150 483 L450 483"/>
      <path d="M150 533 L450 533"/>
    </g>
    <!-- Cruces más claros donde se juntan los hilos -->
    <g fill="#9FC7AA" fill-opacity="0.3">
      <rect x="150" y="358" width="300" height="3"/>
    </g>
    <!-- Pliegues de la falda (tonos planos) -->
    <path d="M221 330 L253 330 L233 570 L185 570 Z" fill="#12301F" fill-opacity="0.35"/>
    <path d="M285 330 L317 330 L325 570 L278 570 Z" fill="#12301F" fill-opacity="0.35"/>
    <path d="M349 330 L381 330 L419 570 L372 570 Z" fill="#12301F" fill-opacity="0.35"/>
    <path d="M253 330 L285 330 L278 570 L233 570 Z" fill="#FFFFFF" fill-opacity="0.06"/>
    <path d="M317 330 L349 330 L372 570 L325 570 Z" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="150" y="320" width="300" height="260" fill="url(#sarga)"/>
  </g>
  <!-- Líneas de los pliegues planchados -->
  <g fill="none" stroke="#1B3A27" stroke-width="1.5" stroke-linecap="round">
    <path d="M221 346 L185 568"/>
    <path d="M285 346 L278 568"/>
    <path d="M349 346 L372 568"/>
  </g>
  <path d="M205 330 L395 330 L440 570 L160 570 Z" fill="none" stroke="#1B3A27" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pretina y dobladillo con puntadas -->
  <path d="M205 330 L395 330 L395 346 L205 346 Z" fill="#2E5A3E" stroke="#1B3A27" stroke-width="2"/>
  <rect x="205" y="330" width="190" height="16" fill="url(#sarga)"/>
  <path d="M209 338 L391 338" fill="none" stroke="#9FC7AA" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M168 556 L432 556" fill="none" stroke="#B4D8BF" stroke-width="1.4" stroke-dasharray="6 4"/>
</svg>
