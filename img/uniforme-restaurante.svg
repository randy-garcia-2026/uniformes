<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: uniforme de restaurante (polo y delantal largo) de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Uniforme de restaurante, polo y delantal largo</title>

  <!-- Polo negro (dibujado en 600 x 600 y reducido) -->
  <g transform="translate(114,0) scale(0.62)">
    <path d="M250 85 L150 115 L70 215 L140 255 L160 225 L160 510 L440 510 L440 225 L460 255 L530 215 L450 115 L350 85 Q300 125 250 85 Z"
          fill="#2B2B2B" stroke="#0D0D0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M250 82 L226 102 L270 148 L300 122 Q275 112 250 82 Z" fill="#2B2B2B" stroke="#0D0D0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M350 82 L374 102 L330 148 L300 122 Q325 112 350 82 Z" fill="#2B2B2B" stroke="#0D0D0D" stroke-width="5" stroke-linejoin="round"/>
    <rect x="288" y="122" width="24" height="120" fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3"/>
    <g fill="#2B2B2B" stroke="#0D0D0D" stroke-width="2.5">
      <circle cx="300" cy="150" r="5"/>
      <circle cx="300" cy="185" r="5"/>
      <circle cx="300" cy="220" r="5"/>
    </g>
    <g fill="none" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round">
      <path d="M150 115 Q177 170 160 225"/>
      <path d="M450 115 Q423 170 440 225"/>
      <path d="M77 203 L150 241"/>
      <path d="M523 203 L450 241"/>
    </g>
    <!-- Recuadro del bordado del cliente (pecho), vacío -->
    <rect x="195" y="185" width="62" height="50" rx="3" fill="none"
          stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>

  <!-- Cintas del delantal atadas a la cintura -->
  <g fill="none" stroke="#555B63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 262 L172 268 L160 300"/>
    <path d="M205 262 L175 280 L178 312"/>
    <path d="M395 262 L428 268 L440 300"/>
    <path d="M395 262 L425 280 L422 312"/>
  </g>

  <!-- Delantal largo gris -->
  <path d="M205 252 L395 252 L395 270 L408 570 L192 570 L205 270 Z"
        fill="#8A9099" stroke="#555B63" stroke-width="3" stroke-linejoin="round"/>
  <path d="M205 270 L395 270" fill="none" stroke="#555B63" stroke-width="1.5"/>
  <g fill="none" stroke="#555B63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M242 410 L358 410 L358 485 L242 485 Z"/>
    <path d="M300 410 L300 485"/>
    <path d="M198 556 L402 556" stroke-dasharray="6 4"/>
  </g>
</svg>
