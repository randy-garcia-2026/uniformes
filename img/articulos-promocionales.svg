<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: artículos promocionales (gorra, taza, bolsa de tela y sombrilla) de Uniformes Eli. No son fotos reales de artículos del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Artículos promocionales: gorra, taza, bolsa de tela y sombrilla</title>

  <!-- Gorra azul marino -->
  <path d="M70 175 Q70 70 150 68 Q230 70 230 175 Z" fill="#22406B" stroke="#12233D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 175 Q150 150 238 175 Q242 215 150 226 Q58 215 62 175 Z" fill="#22406B" stroke="#12233D" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#12233D" stroke-width="1.5" stroke-linecap="round">
    <path d="M150 68 L150 160"/>
    <path d="M110 76 Q100 120 108 164"/>
    <path d="M190 76 Q200 120 192 164"/>
    <path d="M72 190 Q150 168 228 190" stroke-dasharray="5 4"/>
  </g>
  <circle cx="150" cy="66" r="5" fill="#22406B" stroke="#12233D" stroke-width="1.5"/>
  <rect x="121" y="98" width="58" height="40" rx="3" fill="none" stroke="#9FB3CC" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Taza blanca -->
  <path d="M495 120 Q545 118 545 158 Q545 198 495 196 L495 180 Q525 182 525 158 Q525 134 495 136 Z"
        fill="#F4F4F4" stroke="#8C8C8C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M395 105 L395 195 Q395 217 417 217 L473 217 Q495 217 495 195 L495 105 Z"
        fill="#F4F4F4" stroke="#8C8C8C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M395 118 L495 118" fill="none" stroke="#8C8C8C" stroke-width="1.5"/>
  <rect x="415" y="138" width="60" height="46" rx="3" fill="none" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Bolsa de tela gris -->
  <path d="M108 396 Q108 322 150 322 Q192 322 192 396 L178 396 Q178 338 150 338 Q122 338 122 396 Z"
        fill="#A9ADB3" stroke="#6B7078" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M85 392 L215 392 L224 535 L76 535 Z" fill="#A9ADB3" stroke="#6B7078" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round">
    <path d="M87 408 L213 408" stroke-dasharray="6 4"/>
    <path d="M79 520 L221 520" stroke-dasharray="6 4"/>
  </g>
  <rect x="115" y="435" width="70" height="62" rx="3" fill="none" stroke="#6B7078" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Sombrilla negra -->
  <path d="M350 410 Q360 305 445 300 Q530 305 540 410 Q516 392 492.5 410 Q468 392 445 410 Q421 392 397.5 410 Q374 392 350 410 Z"
        fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round">
    <path d="M445 300 Q385 335 350 410"/>
    <path d="M445 300 Q415 345 397.5 410"/>
    <path d="M445 300 L445 410"/>
    <path d="M445 300 Q475 345 492.5 410"/>
    <path d="M445 300 Q505 335 540 410"/>
  </g>
  <path d="M445 300 L445 286" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round"/>
  <path d="M445 410 L445 522 Q445 547 468 547 Q490 547 490 524" fill="none" stroke="#0D0D0D" stroke-width="6" stroke-linecap="round"/>
</svg>
