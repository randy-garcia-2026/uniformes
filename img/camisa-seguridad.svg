<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: camisa de seguridad con franjas reflectivas de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Camisa de seguridad</title>

  <!-- Cuerpo y mangas largas -->
  <path d="M250 85 L150 110 L80 420 L142 445 L174 255 L170 510 L430 510 L426 255 L458 445 L520 420 L450 110 L350 85 Q300 125 250 85 Z"
        fill="#22406B" stroke="#12233D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Franjas reflectivas amarillo verdoso: pecho y mangas -->
  <g fill="#C5D82E" stroke="#7F8E10" stroke-width="1.5" stroke-linejoin="round">
    <rect x="173" y="300" width="254" height="14"/>
    <rect x="173" y="328" width="254" height="14"/>
    <path d="M107 300 L104 314 L164 314 L166 300 Z"/>
    <path d="M101 328 L98 342 L159 342 L162 328 Z"/>
    <path d="M493 300 L496 314 L436 314 L434 300 Z"/>
    <path d="M499 328 L502 342 L441 342 L438 328 Z"/>
  </g>

  <!-- Cuello clásico -->
  <path d="M250 82 L222 108 L262 150 L300 122 Q275 112 250 82 Z"
        fill="#22406B" stroke="#12233D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M350 82 L378 108 L338 150 L300 122 Q325 112 350 82 Z"
        fill="#22406B" stroke="#12233D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tapeta y botones (por encima de las franjas) -->
  <rect x="288" y="122" width="24" height="388" fill="#22406B" stroke="#12233D" stroke-width="2"/>
  <g fill="#22406B" stroke="#12233D" stroke-width="1.5">
    <circle cx="300" cy="162" r="4.5"/>
    <circle cx="300" cy="205" r="4.5"/>
    <circle cx="300" cy="248" r="4.5"/>
    <circle cx="300" cy="287" r="4.5"/>
    <circle cx="300" cy="365" r="4.5"/>
    <circle cx="300" cy="410" r="4.5"/>
    <circle cx="300" cy="455" r="4.5"/>
    <circle cx="300" cy="490" r="4.5"/>
  </g>

  <!-- Costuras finas: sisas, puños, dobladillo -->
  <g fill="none" stroke="#12233D" stroke-width="1.5" stroke-linecap="round">
    <path d="M150 110 Q180 180 174 255"/>
    <path d="M450 110 Q420 180 426 255"/>
    <path d="M86 390 L146 418"/>
    <path d="M514 390 L454 418"/>
    <path d="M178 498 L422 498" stroke-dasharray="6 4"/>
  </g>
  <g fill="#22406B" stroke="#12233D" stroke-width="1.5">
    <circle cx="115" cy="419" r="3.5"/>
    <circle cx="485" cy="419" r="3.5"/>
  </g>

  <!-- Dos bolsillos con solapa -->
  <g fill="#22406B" stroke="#12233D" stroke-width="1.5" stroke-linejoin="round">
    <path d="M190 208 L254 208 L254 268 L190 268 Z"/>
    <path d="M346 208 L410 208 L410 268 L346 268 Z"/>
    <path d="M190 208 L254 208 L254 228 L222 238 L190 228 Z"/>
    <path d="M346 208 L410 208 L410 228 L378 238 L346 228 Z"/>
  </g>
  <g fill="#12233D">
    <circle cx="222" cy="230" r="2.5"/>
    <circle cx="378" cy="230" r="2.5"/>
  </g>

  <!-- Recuadro del bordado del cliente, vacío -->
  <rect x="345" y="160" width="56" height="32" rx="3" fill="none"
        stroke="#9FB3CC" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
