<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: uniforme de seguridad (camisa y pantalón cargo) de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Uniforme de seguridad, camisa y pantalón cargo</title>

  <!-- Camisa de manga larga (dibujada en 600 x 600 y reducida) -->
  <g transform="translate(155,10) scale(0.54)">
    <path d="M250 85 L150 110 L80 420 L142 445 L174 255 L170 510 L430 510 L426 255 L458 445 L520 420 L450 110 L350 85 Q300 125 250 85 Z"
          fill="#1E3050" stroke="#0E1A2E" stroke-width="5" stroke-linejoin="round"/>

    <!-- Cuello -->
    <path d="M250 82 L222 108 L262 150 L300 122 Q275 112 250 82 Z" fill="#1E3050" stroke="#0E1A2E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M350 82 L378 108 L338 150 L300 122 Q325 112 350 82 Z" fill="#1E3050" stroke="#0E1A2E" stroke-width="5" stroke-linejoin="round"/>

    <!-- Tapeta y botones -->
    <rect x="288" y="122" width="24" height="388" fill="#1E3050" stroke="#0E1A2E" stroke-width="3"/>
    <g fill="#1E3050" stroke="#0E1A2E" stroke-width="3">
      <circle cx="300" cy="165" r="6"/>
      <circle cx="300" cy="230" r="6"/>
      <circle cx="300" cy="295" r="6"/>
      <circle cx="300" cy="360" r="6"/>
      <circle cx="300" cy="425" r="6"/>
      <circle cx="300" cy="485" r="6"/>
    </g>

    <!-- Hombreras con botón -->
    <g fill="#1E3050" stroke="#0E1A2E" stroke-width="3" stroke-linejoin="round">
      <path d="M176 106 L238 90 L242 110 L182 128 Z"/>
      <path d="M424 106 L362 90 L358 110 L418 128 Z"/>
    </g>
    <g fill="#0E1A2E">
      <circle cx="232" cy="100" r="3.5"/>
      <circle cx="368" cy="100" r="3.5"/>
    </g>

    <!-- Costuras finas: sisas, puños, dobladillo -->
    <g fill="none" stroke="#0E1A2E" stroke-width="3" stroke-linecap="round">
      <path d="M150 110 Q180 180 174 255"/>
      <path d="M450 110 Q420 180 426 255"/>
      <path d="M86 390 L146 418"/>
      <path d="M514 390 L454 418"/>
      <path d="M178 498 L422 498" stroke-dasharray="8 6"/>
    </g>

    <!-- Dos bolsillos con solapa -->
    <g fill="#1E3050" stroke="#0E1A2E" stroke-width="3" stroke-linejoin="round">
      <path d="M185 320 L250 320 L250 388 L185 388 Z"/>
      <path d="M350 320 L415 320 L415 388 L350 388 Z"/>
      <path d="M185 320 L250 320 L250 342 L217.5 352 L185 342 Z"/>
      <path d="M350 320 L415 320 L415 342 L382.5 352 L350 342 Z"/>
    </g>

    <!-- Espacio para credencial (vacío): ranura y recuadro -->
    <g fill="none" stroke="#9FB0C8" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round">
      <rect x="345" y="168" width="60" height="84" rx="6"/>
    </g>
    <rect x="365" y="160" width="20" height="9" rx="2" fill="none" stroke="#9FB0C8" stroke-width="3"/>

    <!-- Recuadro del bordado del cliente (pecho izquierdo), vacío -->
    <rect x="190" y="175" width="60" height="42" rx="4" fill="none"
          stroke="#9FB0C8" stroke-width="3" stroke-dasharray="7 5"/>
  </g>

  <!-- Pantalón tipo cargo -->
  <path d="M215 308 L385 308 L400 578 L308 578 L300 410 L292 578 L200 578 Z"
        fill="#1E3050" stroke="#0E1A2E" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#0E1A2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 330 L386 330"/>
    <path d="M300 330 L300 392 Q300 404 292 408"/>
    <path d="M238 308 L238 330"/>
    <path d="M300 308 L300 330"/>
    <path d="M362 308 L362 330"/>
    <path d="M222 345 Q242 355 246 385"/>
    <path d="M378 345 Q358 355 354 385"/>
    <!-- Bolsillos cargo con solapa en los muslos -->
    <path d="M204 430 L258 430 L260 500 L202 500 Z"/>
    <path d="M204 430 L258 430 L259 448 L231 456 L203 448 Z"/>
    <path d="M396 430 L342 430 L340 500 L398 500 Z"/>
    <path d="M396 430 L342 430 L341 448 L369 456 L397 448 Z"/>
    <path d="M203 562 L291 562" stroke-dasharray="6 4"/>
    <path d="M309 562 L397 562" stroke-dasharray="6 4"/>
  </g>
</svg>
