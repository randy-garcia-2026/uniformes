<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: blusa formal de mujer de Uniformes Eli. No es una foto real de una prenda del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Blusa formal de mujer</title>

  <!-- Cuerpo entallado y mangas largas -->
  <path d="M262 88 L165 108 L98 418 L150 440 L180 255 Q204 375 188 510 L412 510 Q396 375 420 255 L450 440 L502 418 L435 108 L338 88 Q300 122 262 88 Z"
        fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cuello pequeño -->
  <path d="M262 85 L242 102 L274 138 L300 118 Q282 110 262 85 Z"
        fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M338 85 L358 102 L326 138 L300 118 Q318 110 338 85 Z"
        fill="#2B2B2B" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tapeta fina y botones -->
  <rect x="294" y="118" width="12" height="392" fill="#2B2B2B" stroke="#0D0D0D" stroke-width="2"/>
  <g fill="#2B2B2B" stroke="#0D0D0D" stroke-width="1.5">
    <circle cx="300" cy="150" r="3.5"/>
    <circle cx="300" cy="195" r="3.5"/>
    <circle cx="300" cy="240" r="3.5"/>
    <circle cx="300" cy="285" r="3.5"/>
    <circle cx="300" cy="330" r="3.5"/>
    <circle cx="300" cy="375" r="3.5"/>
    <circle cx="300" cy="420" r="3.5"/>
    <circle cx="300" cy="465" r="3.5"/>
  </g>

  <!-- Costuras finas: sisas, pinzas, puños, dobladillo -->
  <g fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round">
    <path d="M165 108 Q195 180 180 255"/>
    <path d="M435 108 Q405 180 420 255"/>
    <path d="M236 335 Q244 390 236 440"/>
    <path d="M364 335 Q356 390 364 440"/>
    <path d="M104 392 L156 416"/>
    <path d="M496 392 L444 416"/>
    <path d="M194 498 L406 498" stroke-dasharray="6 4"/>
  </g>
  <!-- Botones de los puños -->
  <g fill="#2B2B2B" stroke="#0D0D0D" stroke-width="1.5">
    <circle cx="128" cy="421" r="3"/>
    <circle cx="472" cy="421" r="3"/>
  </g>

  <!-- Recuadro del bordado del cliente, vacío -->
  <rect x="212" y="172" width="44" height="34" rx="3" fill="none"
        stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
