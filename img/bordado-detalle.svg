<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración de ejemplo: primer plano de un bordado de Uniformes Eli. Rombo bordado con puntada de relleno, línea de puntadas y aguja. Dibujo propio, sin letras, escudos ni logos. No es una foto real de un trabajo del taller. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img">
  <title>Detalle de bordado personalizado</title>
  <rect x="40" y="40" width="520" height="520" rx="14" fill="#22406B" stroke="#12233D" stroke-width="3"/>
  <rect x="58" y="58" width="484" height="484" rx="8" fill="none" stroke="#9FB3CC" stroke-width="1.5" stroke-dasharray="7 5"/>
  <!-- Rombo exterior: contorno con puntada corrida -->
  <path d="M300 130 L470 300 L300 470 L130 300 Z" fill="none" stroke="#E9A27F" stroke-width="5" stroke-linejoin="round" stroke-dasharray="14 9" stroke-linecap="round"/>
  <!-- Rombo interior: puntada de relleno -->
  <path d="M300 180 L420 300 L300 420 L180 300 Z" fill="#1A3357"/>
  <g stroke="#F3D9B8" stroke-width="4" stroke-linecap="round"><path d="M184.5 295.5 V304.5"/><path d="M193.5 286.5 V313.5"/><path d="M202.5 277.5 V322.5"/><path d="M211.5 268.5 V331.5"/><path d="M220.5 259.5 V340.5"/><path d="M229.5 250.5 V349.5"/><path d="M238.5 241.5 V358.5"/><path d="M247.5 232.5 V367.5"/><path d="M256.5 223.5 V376.5"/><path d="M265.5 214.5 V385.5"/><path d="M274.5 205.5 V394.5"/><path d="M283.5 196.5 V403.5"/><path d="M292.5 187.5 V412.5"/><path d="M301.5 181.5 V418.5"/><path d="M310.5 190.5 V409.5"/><path d="M319.5 199.5 V400.5"/><path d="M328.5 208.5 V391.5"/><path d="M337.5 217.5 V382.5"/><path d="M346.5 226.5 V373.5"/><path d="M355.5 235.5 V364.5"/><path d="M364.5 244.5 V355.5"/><path d="M373.5 253.5 V346.5"/><path d="M382.5 262.5 V337.5"/><path d="M391.5 271.5 V328.5"/><path d="M400.5 280.5 V319.5"/><path d="M409.5 289.5 V310.5"/><path d="M418.5 298.5 V301.5"/></g>
  <path d="M300 180 L420 300 L300 420 L180 300 Z" fill="none" stroke="#B5532F" stroke-width="6" stroke-linejoin="round"/>
  <!-- Rombo pequeño al centro -->
  <path d="M300 265 L335 300 L300 335 L265 300 Z" fill="#B5532F" stroke="#22406B" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hilo que sale de la tela hacia la aguja -->
  <path d="M470 300 C 500 300, 505 215, 470 160" fill="none" stroke="#E9A27F" stroke-width="4" stroke-linecap="round"/>
  <!-- Aguja -->
  <g transform="rotate(-35 470 160)">
    <rect x="462" y="60" width="16" height="190" rx="8" fill="#D9DEE6" stroke="#12233D" stroke-width="2"/>
    <ellipse cx="470" cy="84" rx="3.5" ry="11" fill="#22406B"/>
    <path d="M462 250 L470 285 L478 250 Z" fill="#D9DEE6" stroke="#12233D" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
